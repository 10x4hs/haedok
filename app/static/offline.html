<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>오프라인 — 偕讀 해독</title>
<style>
  /* 앱(app.css)과 같은 토큰·유리 카드. 오프라인이라 외부 폰트는 쓰지 않는다 */
  :root{--bg:#0a0a0a;--text:#fafafa;--dim:#9a9ca3;--accent:#ffb3c7;--accent-ink:#2a1119;--glass:rgba(255,255,255,.08);--glass-line:rgba(255,255,255,.18);color-scheme:dark}
  @media (prefers-color-scheme:light){:root{--bg:#f4f4f6;--text:#0a0a0a;--dim:#55585f;--accent:#e2557f;--accent-ink:#1a0d12;--glass:rgba(255,255,255,.7);--glass-line:rgba(10,10,10,.08);color-scheme:light}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;padding:24px;background:radial-gradient(80% 50% at 50% 0%,rgba(255,140,180,.14),transparent 70%),var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;text-align:center}
  .card{display:grid;justify-items:center;gap:8px;width:min(100%,360px);padding:34px 24px 26px;border-radius:28px;background:var(--glass);border:1px solid var(--glass-line);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 30px 80px -24px rgba(0,0,0,.6)}
  .brand{font:600 40px/1 "Noto Serif KR",serif;color:var(--accent);letter-spacing:.04em}
  .brand small{display:block;font:500 12px/1 inherit;font-family:inherit;color:var(--dim);margin-top:6px;letter-spacing:.3em}
  .ic{display:block;margin:18px 0 2px;color:var(--accent)}
  .ic svg{width:32px;height:32px}
  h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em}
  p{margin:0;color:var(--dim);max-width:30ch;text-wrap:pretty}
  button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:16px;padding:0 24px;border:0;border-radius:999px;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);font:600 15px/1 inherit;font-family:inherit;transition:transform .3s cubic-bezier(.16,1,.3,1)}
  button:active{transform:scale(.97)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .st{margin-top:14px;font-size:12px;color:var(--dim)}
  .st.on{color:#8fe3b8}
  @media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main class="card">
  <span class="brand" aria-label="해독 偕讀">偕讀<small aria-hidden="true">해독</small></span>
  <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M5 12.5a11 11 0 0 1 4-2.6M8.5 16a6 6 0 0 1 4-1.5M12 19.5h.01"/><path d="M12 5c3.5 0 6.7 1.3 9 3.5"/></svg></span>
  <h1>인터넷에 연결되어 있지 않아요</h1>
  <p>연결되면 읽던 자리로 바로 돌아가요. 그동안 읽은 쪽은 연결된 뒤에 저장돼요.</p>
  <button type="button" onclick="location.reload()">다시 시도</button>
  <span class="st" id="st" role="status" aria-live="polite">연결을 기다리는 중…</span>
</main>
<script>
  // 연결이 돌아오면 알려 주고 1초 뒤 자동으로 다시 연다
  addEventListener('online', () => { const s = document.getElementById('st'); s.textContent = '연결됐어요 · 다시 여는 중'; s.className = 'st on'; setTimeout(() => location.reload(), 1000); });
</script>
</body>
</html>
