{# /races 맨 위 한 줄: 모집 중인 같이 읽기(최대 3개) + 모집하기 #}
{% from "board/_card.html" import post_card %}
<section class="row tg-row" aria-labelledby="tgRowH">
  <link rel="stylesheet" href="/static/board.css">
  <div class="row-h"><h2 id="tgRowH">모집 중인 같이 읽기</h2><a href="/together">전체 보기 ›</a></div>
  {% if together %}
  <div class="tg-list">{% for v in together %}{{ post_card(v) }}{% endfor %}</div>
  {% else %}
  <p class="muted small tg-none">지금 모집 중인 글이 없어요. 읽고 싶은 고전으로 첫 글을 올려 볼까요?</p>
  {% endif %}
  <a class="btn ghost wide tg-cta" href="/together/new">같이 읽을 사람 모집하기</a>
</section>
