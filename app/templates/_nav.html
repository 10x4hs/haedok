{# 아래 막대 · 왼쪽 레일 아이콘 — 24 그리드, 선 1.7. 칸마다 빈 모양(.nv-o)과 채운 모양(.nv-f)을 함께 두고
   선택된 칸(a.on)에서만 채운 모양을 보인다(nav.css). 색은 currentColor. 브랜드 그림은 쓰지 않는다. #}
{% macro nav_icon(name) -%}
<svg class="ic nv-ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
{%- if name == 'home' %}
<g class="nv-o"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></g>
<g class="nv-f"><path fill="currentColor" d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></g>
{%- elif name == 'discover' %}
<g class="nv-o"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></g>
<g class="nv-f"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M12 2.15a9.85 9.85 0 1 1 0 19.7 9.85 9.85 0 0 1 0-19.7zm4.3 5.55-6.3 2.3-2.3 6.3 6.3-2.3z"/></g>
{%- elif name == 'community' %}
{# 커뮤니티: 두 사람 — 피드 · 메시지 · 같이 읽기가 이 칸 안에 있다 #}
<g class="nv-o"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-6 6.5-6s5.9 2.4 6.5 6"/><path d="M15.5 4.8a3.3 3.3 0 0 1 0 6.4"/><path d="M17.8 14.4c2 .7 3.3 2.7 3.7 5.6"/></g>
<g class="nv-f"><circle cx="9" cy="8" r="3.6" fill="currentColor"/><path fill="currentColor" d="M2.5 20.2c.6-3.7 3.2-6.2 6.5-6.2s5.9 2.5 6.5 6.2c.1.5-.3.8-.8.8H3.3c-.5 0-.9-.3-.8-.8z"/><path d="M15.5 4.8a3.3 3.3 0 0 1 0 6.4"/><path d="M17.8 14.4c2 .7 3.3 2.7 3.7 5.6"/></g>
{%- elif name == 'library' %}
{# 서재: 펼친 책 + 책등에 꽂힌 깃발(대결) — 내 책과 대결을 한 칸에 #}
<g class="nv-o"><path d="M3 9.5c2.8-1 5.8-.7 9 1.2 3.2-1.9 6.2-2.2 9-1.2v10.3c-2.8-1-5.8-.7-9 1.2-3.2-1.9-6.2-2.2-9-1.2z"/><path d="M12 10.7V21"/><path d="M12 10.7V2.8l5 2.2-5 2.2"/></g>
<g class="nv-f"><path fill="currentColor" d="M3 9.5c2.8-1 5.8-.7 9 1.2 3.2-1.9 6.2-2.2 9-1.2v10.3c-2.8-1-5.8-.7-9 1.2-3.2-1.9-6.2-2.2-9-1.2z"/><path fill="currentColor" d="M12 10.7V2.8l5 2.2-5 2.2"/></g>
{%- endif %}
</svg>
{%- endmacro %}
