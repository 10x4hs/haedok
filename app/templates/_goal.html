{# 하루 목표 · 잔디 · 연속 읽기 (feature goals) — 숫자는 goals.js 가 /api/v1/me/goal 로 채운다 #}
{% if feature_goals() %}
<link rel="stylesheet" href="/static/goals.css">
<section class="goal glass-card" id="goal" aria-labelledby="goal-h" data-goal>
  <h2 class="goal-h" id="goal-h">오늘의 목표</h2>
  <div class="goal-top">
    <div class="goal-ring" aria-hidden="true">
      <svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="19" pathLength="100"/><circle class="fill" cx="22" cy="22" r="19" pathLength="100" data-goal-ring/></svg>
      <span class="mono" data-goal-ring-text>–</span>
    </div>
    <div class="goal-sum">
      <p class="goal-now"><b class="mono" data-goal-today>–/–쪽</b> <span data-goal-minutes></span></p>
      <p class="goal-line" data-goal-streak>불러오는 중…</p>
      <p class="goal-meta"><span data-goal-week></span><span class="goal-freeze-count" data-goal-freezes></span></p>
    </div>
  </div>

  <div class="goal-grass-wrap">
    <div class="goal-months mono" aria-hidden="true" data-goal-months></div>
    <div class="goal-grass" role="group" aria-labelledby="goal-grass-h" data-goal-grass></div>
    <p class="goal-sr" id="goal-grass-h" data-goal-grass-label>읽은 날 기록</p>
  </div>
  <div class="goal-foot">
    <p class="goal-tip" aria-live="polite" data-goal-tip>칸을 누르면 그날 읽은 쪽수가 보여요</p>
    <div class="goal-legend" aria-hidden="true">
      <span>적게</span><i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>많이</span>
      <i class="fz"></i><span>보호권</span>
    </div>
  </div>

  <button type="button" class="goal-edit" aria-expanded="false" aria-controls="goal-set" data-goal-edit>하루에 읽을 쪽 <span class="goal-edit-v"><b class="mono" data-goal-edit-value></b><em aria-hidden="true">›</em></span></button>
  <div class="goal-set" id="goal-set" hidden>
    <div class="goal-stepper" role="group" aria-label="하루에 읽을 쪽">
      <button type="button" class="goal-step" data-goal-step="-1" aria-label="한 쪽 줄이기">−</button>
      <label class="goal-num"><span class="goal-sr">하루에 읽을 쪽수</span><input class="mono" type="number" inputmode="numeric" min="1" max="100" step="1" enterkeyhint="done" data-goal-input></label>
      <span class="goal-unit" aria-hidden="true">쪽</span>
      <button type="button" class="goal-step" data-goal-step="1" aria-label="한 쪽 늘리기">+</button>
      <button type="button" class="goal-help" aria-expanded="false" aria-controls="goal-help" aria-label="목표 규칙 보기" data-goal-help>?</button>
    </div>
    <div class="goal-presets" role="group" aria-label="빠른 선택" data-goal-presets></div>
    <p class="goal-est"><span data-goal-est></span><span class="goal-saved" role="status" data-goal-saved></span></p>
    <div class="goal-help-box" id="goal-help" hidden>
      <p>서버가 인정한 쪽만 세요. 하루는 새벽 4시에 바뀌어요.</p>
      <p>보호권(최대 2개)이 쉬는 날을 메워 줘요. <a href="/docs#h-pace">자세히</a></p>
    </div>
  </div>
</section>
<script src="/static/goals.js" defer></script>
{% endif %}
