name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haedok
          POSTGRES_PASSWORD: haedok
          POSTGRES_DB: haedok
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haedok" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://haedok:haedok@localhost:5432/haedok
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: upgrade → downgrade → upgrade on real Postgres
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - name: models vs migrations drift (alembic check)
        run: uv run alembic check
