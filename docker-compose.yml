services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: haedok
      POSTGRES_PASSWORD: haedok
      POSTGRES_DB: haedok
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haedok"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://haedok:haedok@db:5432/haedok
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
